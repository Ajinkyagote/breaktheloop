    <title>BreakTheLoop | Learning Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configure Tailwind to use the 'dark' class
        tailwind.config = {
          darkMode: 'class',
        }
        
        // Immediate theme application to prevent FOUC (Flash of Unstyled Content)
        const savedTheme = localStorage.getItem('btl_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        }

            background-color: #020617; /* slate-950 */
        }

            display: none;
        }

        }
